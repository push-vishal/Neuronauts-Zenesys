version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finova_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL:-https://dwcnkuazzjrqvcchkocr.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-sb_publishable_XZgIKeNEgCEnMHGlM0DWNg_7W8WFOJz}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=invoices
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finova_frontend
    ports:
      - "80:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://dwcnkuazzjrqvcchkocr.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-sb_publishable_XZgIKeNEgCEnMHGlM0DWNg_7W8WFOJz}
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
